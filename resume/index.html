<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="fonts.css" />
<style id="page-rule">@page { size: A4; margin: 12mm 14mm; }</style>
<style>
/* =============================================================================
   A4 resume template + editor.

   Three rules hold the whole thing together:

   1. Everything is real text. No canvas, no images, no tables, no CSS columns —
      so the printed PDF stays selectable and an ATS reads every word.
   2. Everything is sized in pt against a fixed A4 page, so what renders on
      screen and what comes out of the print dialog are the same document.
   3. Every adjustable value is a custom property on :root. controls.js only
      ever writes those properties, which is why the panel can never make the
      screen and the PDF disagree. The values below are the defaults, and they
      are mirrored in DEFAULTS in controls.js.
   ========================================================================== */

:root {
  /* -- Set by the control panel -------------------------------------------- */
  --font:         'Figtree', 'Segoe UI', system-ui, sans-serif;
  --body:         9.5pt;   /* body copy */
  --leading:      1.45;
  --name-size:    25pt;
  --heading-size: 13.5pt;
  --accent:       #6C63FF; /* name, section headings, links */
  --ink:          #2a2a2a; /* body copy */
  --side-w:       33%;     /* sidebar width as a share of the page's text width */
  --pad-x:        14mm;
  --pad-y:        12mm;

  /* -- Fixed --------------------------------------------------------------- */
  --ink-strong: #111111;
  --muted:      #9b9b9b;   /* dates */
  --rule:       #d8d8d8;
  --paper:      #ffffff;

  --page-w: 210mm;
  --page-h: 297mm;

  /* Panel chrome — deliberately its own scale, so restyling the resume never
     drags the editor's own appearance along with it. */
  --ui-bg:     #ffffff;
  --ui-line:   #e4e6ec;
  --ui-text:   #2b2f3a;
  --ui-muted:  #737a8c;
  --ui-canvas: #eceef2;
  --panel-w:   288px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ui-canvas);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---- Page ---------------------------------------------------------------- */

.page {
  width: var(--page-w);
  min-height: var(--page-h);
  margin: 24px auto;
  padding: var(--pad-y) var(--pad-x);
  background: var(--paper);
  box-shadow: 0 2px 24px rgba(20, 22, 40, 0.14);

  display: grid;
  /* The sidebar is a percentage track rather than a fraction of the main column:
     `fr` units cannot be multiplied inside calc(), so a var-driven fr would make
     the whole declaration invalid and silently collapse the layout. */
  grid-template-columns: minmax(0, 1fr) var(--side-w);
  column-gap: 8mm;
  align-content: start;
  /* Each column reports its own height rather than stretching to the row, which
     is what lets the panel measure page fit honestly. */
  align-items: start;
}

.page > header { grid-column: 1 / -1; }
.page > main   { grid-column: 1; }
.page > aside  { grid-column: 2; }

/* ---- Header -------------------------------------------------------------- */

header.header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  column-gap: 8mm;
}

.identity { grid-column: 1; }

.identity__name {
  margin: 0;
  font-size: var(--name-size);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--accent);
}

.identity__title {
  margin: 4pt 0 0;
  font-size: calc(var(--body) + 2pt);
  font-weight: 400;
  color: #3a3a3a;
}

.identity__tagline {
  margin: 3pt 0 0;
  font-size: calc(var(--body) - 1pt);
  font-weight: 400;
  color: var(--muted);
}

.links {
  grid-column: 2;
  margin: 3pt 0 0;
  padding: 0;
  list-style: none;
  text-align: right;
}

.links li + li { margin-top: 3.5pt; }

.links__link,
.contact__value--link {
  color: var(--accent);
  font-size: calc(var(--body) - 1pt);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* Contact row: Phone | Email | Location, matching the reference layout. */
.contact {
  grid-column: 1 / -1;
  margin: 6mm 0 0;
  font-size: var(--body);
  color: var(--ink);
}

.contact__label { font-weight: 700; }
.contact__divider {
  margin: 0 10pt;
  color: var(--rule);
  font-weight: 400;
}

.summary {
  grid-column: 1 / -1;
  margin: 4.5mm 0 0;
  font-size: var(--body);
  line-height: var(--leading);
  color: var(--ink);
}

/* ---- Sections ------------------------------------------------------------ */

main, aside { min-width: 0; }

main > .section:first-child,
aside > .section:first-child { margin-top: 6mm; }

.section + .section { margin-top: 5mm; }

.section__title {
  margin: 0 0 3mm;
  font-size: var(--heading-size);
  font-weight: 600;
  line-height: 1.2;
  color: var(--accent);
}

/* Keep a job or a skill group whole rather than split across the page break. */
.entry {
  break-inside: avoid;
  page-break-inside: avoid;
}

.entry + .entry { margin-top: 4mm; }

.entry__heading {
  margin: 0;
  font-size: calc(var(--body) + 1.5pt);
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink-strong);
}

.entry__sep {
  margin: 0 5pt;
  font-weight: 400;
  color: #b9b9b9;
}

.entry__role,
.entry__client {
  font-weight: 500;
  color: #2f2f2f;
}

.entry__dates {
  margin: 1.5pt 0 0;
  font-size: calc(var(--body) - 0.5pt);
  font-weight: 400;
  color: var(--muted);
}

.entry__body {
  margin: 2pt 0 0;
  font-size: var(--body);
  line-height: var(--leading);
  color: var(--ink);
}

/* ---- Bullets ------------------------------------------------------------- */

/* Real <ul>/<li> with a real bullet glyph — ATS parsers handle these; glyph
   icons or ::before pseudo-content would be dropped from the extracted text. */
.bullets {
  margin: 2mm 0 0;
  padding-left: 4mm;
  list-style: disc;
}

.bullets li {
  margin-top: 1.6mm;
  padding-left: 1mm;
  font-size: var(--body);
  line-height: var(--leading);
  color: var(--ink);
  orphans: 2;
  widows: 2;
}

.bullets li::marker { color: #8a8a8a; font-size: calc(var(--body) - 1pt); }

strong {
  font-weight: 600;
  color: var(--ink-strong);
}

.recognition__item {
  margin: 0;
  font-size: calc(var(--body) + 0.5pt);
  font-weight: 700;
  line-height: 1.4;
  color: var(--ink-strong);
}

.recognition__item + .recognition__item { margin-top: 3mm; }

/* ---- Control panel (screen only) ----------------------------------------- */

.layout {
  display: flex;
  align-items: flex-start;
  min-height: 100vh;
}

.panel {
  position: sticky;
  top: 0;
  flex: 0 0 var(--panel-w);
  width: var(--panel-w);
  height: 100vh;
  overflow-y: auto;
  padding: 22px 20px 20px;
  background: var(--ui-bg);
  border-right: 1px solid var(--ui-line);
  font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  color: var(--ui-text);
  font-size: 13px;
}

.canvas {
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
}

.panel__title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.panel__body { padding: 14px 0 4px; }

/* Resume switcher — sits above the design controls and is visually distinct
   from them, since it changes content rather than styling. */
.switcher { padding-top: 4px; }

.switcher__select {
  margin-top: 10px;
  font-weight: 600;
}

.switcher .panel__hint { margin: 8px 0 0; }

.switcher + .panel__body {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--ui-line);
}

.field + .field { margin-top: 15px; }

.field__label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 600;
}

.field__value {
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  color: var(--ui-muted);
}

.field__input,
.field__range,
.field__color { width: 100%; }

.field__input {
  padding: 7px 9px;
  border: 1px solid var(--ui-line);
  border-radius: 7px;
  background: #fff;
  font-family: inherit;
  font-size: 13px;
  color: inherit;
}

.field__range {
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 999px;
  background: var(--ui-line);
  outline-offset: 4px;
}

.field__range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 15px;
  height: 15px;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.field__range::-moz-range-thumb {
  width: 15px;
  height: 15px;
  border: 0;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.field__color {
  height: 32px;
  padding: 2px;
  border: 1px solid var(--ui-line);
  border-radius: 7px;
  background: #fff;
  cursor: pointer;
}

.swatches {
  display: flex;
  gap: 6px;
  margin-top: 7px;
}

.swatch {
  width: 22px;
  height: 22px;
  padding: 0;
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 50%;
  cursor: pointer;
}

.panel__footer {
  position: sticky;
  bottom: 0;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--ui-line);
  background: var(--ui-bg);
}

/* The readout that makes the size slider honest: it shows what a bigger font
   costs before you spend a download finding out. */
.fit {
  margin: 0 0 12px;
  padding: 8px 10px;
  border-radius: 7px;
  background: #edfaf1;
  color: #14663a;
  font-size: 12px;
  font-weight: 600;
}

.fit--over {
  background: #fdf1e7;
  color: #9a4a12;
}

.btn {
  display: block;
  width: 100%;
  padding: 11px 14px;
  border: 0;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}

.btn--primary {
  background: var(--accent);
  color: #fff;
}

.btn--ghost {
  margin-top: 8px;
  background: transparent;
  border: 1px solid var(--ui-line);
  color: var(--ui-muted);
}

.btn--ghost:hover { color: var(--ui-text); }

.panel__hint {
  margin: 9px 0 12px;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--ui-muted);
}

.panel-toggle {
  display: none;
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 20;
  padding: 11px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-family: 'Figtree', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(20, 22, 40, 0.28);
}

/* Narrow screens: the panel slides away behind a toggle so the page keeps the
   full width. */
@media (max-width: 1180px) {
  .panel {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 15;
    transform: translateX(-100%);
    transition: transform 0.18s ease;
    box-shadow: 0 0 40px rgba(20, 22, 40, 0.18);
  }

  .panel-open .panel { transform: none; }
  .panel-toggle { display: block; }
}

/* ---- Print --------------------------------------------------------------- */

/* The @page rule lives in its own <style id="page-rule"> element, which
   controls.js rewrites whenever the margin sliders move. It has to work that way
   because @page cannot read custom properties — every other setting is a
   variable, this one is a rewritten rule, and the result is the same: the panel
   and the PDF never disagree.

   In print the margin moves from .page's padding onto @page itself. That matters
   the moment content runs past one page: padding is only applied to a block's
   first fragment, so a padded .page would leave page 2 starting flush against
   the paper edge. @page margins apply to every page. */

@media print {
  html, body { background: #fff; }

  .layout { display: block; }
  .canvas { overflow: visible; }

  .page {
    width: auto;
    margin: 0;
    padding: 0;
    box-shadow: none;
    min-height: auto;
  }

  .panel,
  .panel-toggle { display: none !important; }

  /* Keep the accent colour and any backgrounds in the PDF. */
  * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  a { text-decoration: underline; }
}
</style>
</head>
<body>

<div class="layout">

  <aside class="panel" id="controls"></aside>

  <div class="canvas">
    <div class="page" id="resume-page">
      <header class="header" id="resume-header"></header>
      <main id="resume-main"></main>
      <aside id="resume-aside"></aside>
    </div>
  </div>

</div>

<button class="panel-toggle" id="panel-toggle" type="button">Design</button>

<script src="resume-data.js"></script>
<script src="render.js"></script>
<script src="applications/manifest.js"></script>
<script src="controls.js"></script>
</body>
</html>
