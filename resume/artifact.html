<style>
/* =============================================================================
   A4 resume template + editor.

   Three rules hold the whole thing together:

   1. Everything is real text. No canvas, no images, no tables, no CSS columns —
      so the printed PDF stays selectable and an ATS reads every word.
   2. Everything is sized in pt against a fixed A4 page, so what renders on
      screen and what comes out of the print dialog are the same document.
   3. Every adjustable value is a custom property on :root. controls.js only
      ever writes those properties, which is why the panel can never make the
      screen and the PDF disagree. The values below are the defaults, and they
      are mirrored in DEFAULTS in controls.js.
   ========================================================================== */

:root {
  /* -- Set by the control panel -------------------------------------------- */
  --font:         'Figtree', 'Segoe UI', system-ui, sans-serif;
  --body:         9.5pt;   /* body copy */
  --leading:      1.45;
  --name-size:    25pt;
  --heading-size: 13.5pt;
  --accent:       #6C63FF; /* name, section headings, links */
  --ink:          #2a2a2a; /* body copy */
  --side-w:       33%;     /* sidebar width as a share of the page's text width */
  --pad-x:        14mm;
  --pad-y:        12mm;

  /* -- Fixed --------------------------------------------------------------- */
  --ink-strong: #111111;
  --muted:      #9b9b9b;   /* dates */
  --rule:       #d8d8d8;
  --paper:      #ffffff;

  --page-w: 210mm;
  --page-h: 297mm;

  /* Panel chrome — deliberately its own scale, so restyling the resume never
     drags the editor's own appearance along with it. */
  --ui-bg:     #ffffff;
  --ui-line:   #e4e6ec;
  --ui-text:   #2b2f3a;
  --ui-muted:  #737a8c;
  --ui-canvas: #eceef2;
  --panel-w:   288px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ui-canvas);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---- Page ---------------------------------------------------------------- */

.page {
  width: var(--page-w);
  min-height: var(--page-h);
  margin: 24px auto;
  padding: var(--pad-y) var(--pad-x);
  background: var(--paper);
  box-shadow: 0 2px 24px rgba(20, 22, 40, 0.14);

  display: grid;
  /* The sidebar is a percentage track rather than a fraction of the main column:
     `fr` units cannot be multiplied inside calc(), so a var-driven fr would make
     the whole declaration invalid and silently collapse the layout. */
  grid-template-columns: minmax(0, 1fr) var(--side-w);
  column-gap: 8mm;
  align-content: start;
  /* Each column reports its own height rather than stretching to the row, which
     is what lets the panel measure page fit honestly. */
  align-items: start;
}

.page > header { grid-column: 1 / -1; }
.page > main   { grid-column: 1; }
.page > aside  { grid-column: 2; }

/* ---- Header -------------------------------------------------------------- */

header.header {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  column-gap: 8mm;
}

.identity { grid-column: 1; }

.identity__name {
  margin: 0;
  font-size: var(--name-size);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--accent);
}

.identity__title {
  margin: 4pt 0 0;
  font-size: calc(var(--body) + 2pt);
  font-weight: 400;
  color: #3a3a3a;
}

.identity__tagline {
  margin: 3pt 0 0;
  font-size: calc(var(--body) - 1pt);
  font-weight: 400;
  color: var(--muted);
}

.links {
  grid-column: 2;
  margin: 3pt 0 0;
  padding: 0;
  list-style: none;
  text-align: right;
}

.links li + li { margin-top: 3.5pt; }

.links__link,
.contact__value--link {
  color: var(--accent);
  font-size: calc(var(--body) - 1pt);
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* Contact row: Phone | Email | Location, matching the reference layout. */
.contact {
  grid-column: 1 / -1;
  margin: 6mm 0 0;
  font-size: var(--body);
  color: var(--ink);
}

.contact__label { font-weight: 700; }
.contact__divider {
  margin: 0 10pt;
  color: var(--rule);
  font-weight: 400;
}

.summary {
  grid-column: 1 / -1;
  margin: 4.5mm 0 0;
  font-size: var(--body);
  line-height: var(--leading);
  color: var(--ink);
}

/* ---- Sections ------------------------------------------------------------ */

main, aside { min-width: 0; }

main > .section:first-child,
aside > .section:first-child { margin-top: 6mm; }

.section + .section { margin-top: 5mm; }

.section__title {
  margin: 0 0 3mm;
  font-size: var(--heading-size);
  font-weight: 600;
  line-height: 1.2;
  color: var(--accent);
}

/* Keep a job or a skill group whole rather than split across the page break. */
.entry {
  break-inside: avoid;
  page-break-inside: avoid;
}

.entry + .entry { margin-top: 4mm; }

.entry__heading {
  margin: 0;
  font-size: calc(var(--body) + 1.5pt);
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink-strong);
}

.entry__sep {
  margin: 0 5pt;
  font-weight: 400;
  color: #b9b9b9;
}

.entry__role,
.entry__client {
  font-weight: 500;
  color: #2f2f2f;
}

.entry__dates {
  margin: 1.5pt 0 0;
  font-size: calc(var(--body) - 0.5pt);
  font-weight: 400;
  color: var(--muted);
}

.entry__body {
  margin: 2pt 0 0;
  font-size: var(--body);
  line-height: var(--leading);
  color: var(--ink);
}

/* ---- Bullets ------------------------------------------------------------- */

/* Real <ul>/<li> with a real bullet glyph — ATS parsers handle these; glyph
   icons or ::before pseudo-content would be dropped from the extracted text. */
.bullets {
  margin: 2mm 0 0;
  padding-left: 4mm;
  list-style: disc;
}

.bullets li {
  margin-top: 1.6mm;
  padding-left: 1mm;
  font-size: var(--body);
  line-height: var(--leading);
  color: var(--ink);
  orphans: 2;
  widows: 2;
}

.bullets li::marker { color: #8a8a8a; font-size: calc(var(--body) - 1pt); }

strong {
  font-weight: 600;
  color: var(--ink-strong);
}

.recognition__item {
  margin: 0;
  font-size: calc(var(--body) + 0.5pt);
  font-weight: 700;
  line-height: 1.4;
  color: var(--ink-strong);
}

.recognition__item + .recognition__item { margin-top: 3mm; }

/* ---- Control panel (screen only) ----------------------------------------- */

.layout {
  display: flex;
  align-items: flex-start;
  min-height: 100vh;
}

.panel {
  position: sticky;
  top: 0;
  flex: 0 0 var(--panel-w);
  width: var(--panel-w);
  height: 100vh;
  overflow-y: auto;
  padding: 22px 20px 20px;
  background: var(--ui-bg);
  border-right: 1px solid var(--ui-line);
  font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  color: var(--ui-text);
  font-size: 13px;
}

.canvas {
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
}

.panel__title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.panel__body { padding: 14px 0 4px; }

.field + .field { margin-top: 15px; }

.field__label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 600;
}

.field__value {
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  color: var(--ui-muted);

/* The @page rule lives in its own <style id="page-rule"> element, which

   variable, this one is a rewritten rule, and the result is the same: the panel

   In print the margin moves from .page's padding onto @page itself. That matters

<script>/* =============================================================================
   Renders window.RESUME (from resume-data.js) into the template markup.

   Deliberately a classic script, not an ES module, so index.html can be opened
   straight off disk with a double-click (file:// blocks module imports).
   ========================================================================== */

(function () {
  'use strict';

  var data = window.RESUME;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  /* Escapes HTML, then turns **runs** into <strong>. Escaping first means resume
     content can never inject markup, however it is copied and pasted in. */
  function richText(source) {
    var escaped = String(source)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    return escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }

  function setRich(node, source) {
    node.innerHTML = richText(source);
    return node;
  }

  var columns = {
    main: document.getElementById('resume-main'),
    aside: document.getElementById('resume-aside')
  };

  /* A section: indigo heading plus its body. `column` picks which of the two
     grid tracks it is appended to. The DOM order that results — header,
     summary, experience, education, skills, tools, recognition — is also the
     order text is extracted from the printed PDF, which is exactly the order an
     ATS wants to read. */
  function section(title, column) {
    var wrap = el('section', 'section');
    wrap.appendChild(el('h2', 'section__title', title));
    columns[column].appendChild(wrap);
    return wrap;
  }

  // ---- Header ---------------------------------------------------------------

  var header = document.getElementById('resume-header');
  var identity = el('div', 'identity');
  identity.appendChild(el('h1', 'identity__name', data.name));
  identity.appendChild(el('p', 'identity__title', data.title));
  if (data.tagline) identity.appendChild(el('p', 'identity__tagline', data.tagline));

  var linkList = el('ul', 'links');
  (data.links || []).forEach(function (link) {
    var li = el('li');
    var a = el('a', 'links__link', link.label);
    a.href = link.href;
    li.appendChild(a);
    linkList.appendChild(li);
  });

  header.appendChild(identity);
  header.appendChild(linkList);

  var contactRow = el('p', 'contact');
  (data.contact || []).forEach(function (item, index) {
    if (index > 0) contactRow.appendChild(el('span', 'contact__divider', '|'));
    var group = el('span', 'contact__item');
    if (item.label) group.appendChild(el('span', 'contact__label', item.label + ' : '));
    if (item.href) {
      var a = el('a', 'contact__value contact__value--link', item.value);
      a.href = item.href;
      group.appendChild(a);
    } else {
      group.appendChild(el('span', 'contact__value', item.value));
    }
    contactRow.appendChild(group);
  });
  header.appendChild(contactRow);

  if (data.summary) {
    header.appendChild(setRich(el('p', 'summary'), data.summary));
  }

  // ---- Body -----------------------------------------------------------------

  // Experience (left column)
  if ((data.experience || []).length) {
    var experience = section('Experience', 'main');
    data.experience.forEach(function (job) {
      var entry = el('article', 'entry');

      var heading = el('h3', 'entry__heading');
      heading.appendChild(el('span', 'entry__company', job.company));
      if (job.role) {
        heading.appendChild(el('span', 'entry__sep', '|'));
        heading.appendChild(el('span', 'entry__role', job.role));
      }
      if (job.client) {
        heading.appendChild(el('span', 'entry__sep', '|'));
        heading.appendChild(el('span', 'entry__client', job.client));
      }
      entry.appendChild(heading);

      if (job.dates) entry.appendChild(el('p', 'entry__dates', job.dates));

      var list = el('ul', 'bullets');
      (job.bullets || []).forEach(function (bullet) {
        list.appendChild(setRich(el('li'), bullet));
      });
      entry.appendChild(list);

      experience.appendChild(entry);
    });
  }

  // Education (right column)
  if ((data.education || []).length) {
    var education = section('Education', 'aside');
    data.education.forEach(function (item) {
      var entry = el('div', 'entry');
      entry.appendChild(el('h3', 'entry__heading', item.school));
      if (item.dates) entry.appendChild(el('p', 'entry__dates', item.dates));
      if (item.degree) entry.appendChild(el('p', 'entry__body', item.degree));
      education.appendChild(entry);
    });
  }

  // Skills (right column)
  if ((data.skills || []).length) {
    var skills = section('Skills', 'aside');
    data.skills.forEach(function (group) {
      var entry = el('div', 'entry');
      entry.appendChild(el('h3', 'entry__heading', group.group));
      entry.appendChild(el('p', 'entry__body', group.items));
      skills.appendChild(entry);
    });
  }

  // Tools (right column)
  if (data.tools) {
    var tools = section('Tools', 'aside');
    tools.appendChild(el('p', 'entry__body', data.tools));
  }

  // Recognition (right column)
  if ((data.recognition || []).length) {
    var recognition = section('Recognition', 'aside');
    data.recognition.forEach(function (item) {
      recognition.appendChild(el('p', 'recognition__item', item));
    });
  }

  // ---- Download -------------------------------------------------------------

  /* The browser's own print-to-PDF is what keeps the download an exact replica:
     it writes real vector text, so the file both looks identical and stays
     readable by ATS scanners. The page title becomes the suggested filename. */
  if (data.fileName) document.title = data.fileName;

  var button = document.getElementById('download');
  if (button) {
    button.addEventListener('click', function () {
      window.print();
    });
  }
})();
</script>
<script>/* =============================================================================
   The control panel.

   Every control does exactly one thing: write a CSS custom property onto the
   document element. The stylesheet already reads those properties, so nothing
   here re-renders the resume or duplicates any layout logic — and because the
   properties live on :root, they carry straight into the print output. That is
   what keeps the screen and the downloaded PDF identical whatever you change.

   Classic script, like render.js, so index.html still opens from file://.
   ========================================================================== */

(function () {
  'use strict';

  var STORE_KEY = 'resume-settings-v1';

  /* Single source of truth. The stylesheet repeats these as fallbacks, the panel
     builds itself from them, and Reset restores them. */
  var DEFAULTS = {
    font: 'Figtree',
    body: 9.5,
    leading: 1.45,
    nameSize: 25,
    headingSize: 13.5,
    accent: '#6C63FF',
    ink: '#2a2a2a',
    sideW: 33,
    padX: 14,
    padY: 12
  };

  var ACCENT_PRESETS = [
    '#6C63FF', // the original indigo
    '#2563EB', // blue
    '#0F766E', // teal
    '#B91C1C', // red
    '#C2410C', // orange
    '#111827'  // near-black, for a monochrome resume
  ];

  /* Each control maps a setting onto a CSS variable. `css` turns the stored
     value into the property value; where it is omitted the value is used as-is. */
  var CONTROLS = [
    {
      key: 'font', label: 'Font', type: 'select', variable: '--font',
      options: [
        { value: 'Figtree', label: 'Figtree' },
        { value: 'Inter', label: 'Inter' }
      ],
      css: function (v) { return "'" + v + "', 'Segoe UI', system-ui, sans-serif"; }
    },
    {
      /* The floor is 9pt on purpose: below that a printed resume gets hard to
         read, and shrinking type is the wrong way to win a page. The fit badge
         below shows what each step costs, so a second page is a choice rather
         than a surprise. */
      key: 'body', label: 'Text size', type: 'range', variable: '--body',
      min: 9, max: 12, step: 0.1, unit: 'pt',
      css: function (v) { return v + 'pt'; }
    },
    {
      key: 'leading', label: 'Line spacing', type: 'range', variable: '--leading',
      min: 1.2, max: 1.8, step: 0.05, unit: ''
    },
    {
      key: 'nameSize', label: 'Name size', type: 'range', variable: '--name-size',
      min: 18, max: 34, step: 0.5, unit: 'pt',
      css: function (v) { return v + 'pt'; }
    },
    {
      key: 'headingSize', label: 'Heading size', type: 'range', variable: '--heading-size',
      min: 10, max: 18, step: 0.5, unit: 'pt',
      css: function (v) { return v + 'pt'; }
    },
    {
      /* One accent drives the name, the section headings and the links together,
         so those three can never drift out of agreement. */
      key: 'accent', label: 'Accent color', type: 'color', variable: '--accent',
      presets: ACCENT_PRESETS
    },
    {
      key: 'ink', label: 'Text color', type: 'color', variable: '--ink'
    },
    {
      key: 'sideW', label: 'Sidebar width', type: 'range', variable: '--side-w',
      min: 24, max: 46, step: 0.5, unit: '%',
      css: function (v) { return v + '%'; }
    },
    {
      key: 'padX', label: 'Side margin', type: 'range', variable: '--pad-x',
      min: 8, max: 22, step: 0.5, unit: 'mm',
      css: function (v) { return v + 'mm'; }
    },
    {
      key: 'padY', label: 'Top margin', type: 'range', variable: '--pad-y',
      min: 8, max: 22, step: 0.5, unit: 'mm',
      css: function (v) { return v + 'mm'; }
    }
  ];

  // ---- State ----------------------------------------------------------------

  function load() {
    var settings = {};
    Object.keys(DEFAULTS).forEach(function (key) { settings[key] = DEFAULTS[key]; });
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      Object.keys(saved).forEach(function (key) {
        if (key in DEFAULTS) settings[key] = saved[key];
      });
    } catch (err) {
      /* Corrupt or unavailable storage just means we start from defaults. */
    }
    return settings;
  }

  function save(settings) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(settings));
    } catch (err) {
      /* Private browsing and file:// quotas — not worth breaking the app over. */
    }
  }

  var settings = load();

  function apply(control) {
    var value = settings[control.key];
    document.documentElement.style.setProperty(
      control.variable,
      control.css ? control.css(value) : String(value)
    );
  }

  /* The one setting that cannot be a custom property: @page has no access to
     them, so the margin sliders rewrite the rule itself. Without this the
     sliders would move the margins on screen and leave the PDF unchanged. */
  function applyPageMargins() {
    var rule = document.getElementById('page-rule');
    if (!rule) return;
    rule.textContent =
      '@page { size: A4; margin: ' + settings.padY + 'mm ' + settings.padX + 'mm; }';
  }

  function applyAll() {
    CONTROLS.forEach(apply);
    applyPageMargins();
  }

  // ---- Page fit -------------------------------------------------------------

  var PAGE_H_MM = 297;
  var PX_PER_MM = 96 / 25.4;

  var fitBadge;

  /* Compares the rendered content height against the usable height of one A4
     page, so raising the text size shows its cost immediately rather than after
     a download. The grid uses align-items:start, so each column reports its own
     height instead of being stretched to the row. */
  function measureFit() {
    if (!fitBadge) return;

    var header = document.getElementById('resume-header');
    var main = document.getElementById('resume-main');
    var aside = document.getElementById('resume-aside');
    if (!header || !main || !aside) return;

    var top = header.getBoundingClientRect().top;
    var bottom = Math.max(
      main.getBoundingClientRect().bottom,
      aside.getBoundingClientRect().bottom
    );

    var contentH = bottom - top;
    var usableH = (PAGE_H_MM - 2 * settings.padY) * PX_PER_MM;
    var pages = Math.max(1, Math.ceil(contentH / usableH - 0.001));
    var slackMm = (usableH * pages - contentH) / PX_PER_MM;

    fitBadge.classList.toggle('fit--over', pages > 1);
    fitBadge.textContent =
      pages === 1
        ? 'Fits 1 page · ' + Math.round(slackMm) + 'mm to spare'
        : pages + ' pages · ' + Math.round(slackMm) + 'mm free on the last';
  }

  /* Fonts land after first paint and change every measurement, so re-measure
     once they are ready, and again whenever the page reflows. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(measureFit);
  }
  if (window.ResizeObserver) {
    var observer = new ResizeObserver(measureFit);
    ['resume-main', 'resume-aside'].forEach(function (id) {
      var node = document.getElementById(id);
      if (node) observer.observe(node);
    });
  }

  // ---- Panel ----------------------------------------------------------------

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function formatValue(control) {
    var value = settings[control.key];
    return value + (control.unit || '');
  }

  var panel = document.getElementById('controls');
  if (!panel) return;

  var body = el('div', 'panel__body');
  var valueLabels = {};
  var inputs = {};

  panel.appendChild(el('h2', 'panel__title', 'Design'));

  CONTROLS.forEach(function (control) {
    var field = el('div', 'field');

    var label = el('label', 'field__label');
    label.appendChild(el('span', null, control.label));
    if (control.type === 'range') {
      var readout = el('span', 'field__value', formatValue(control));
      valueLabels[control.key] = readout;
      label.appendChild(readout);
    }
    field.appendChild(label);

    var input;

    if (control.type === 'select') {
      input = el('select', 'field__input');
      control.options.forEach(function (option) {
        var opt = el('option', null, option.label);
        opt.value = option.value;
        input.appendChild(opt);
      });
      input.value = settings[control.key];
    } else if (control.type === 'color') {
      input = el('input', 'field__color');
      input.type = 'color';
      input.value = settings[control.key];
    } else {
      input = el('input', 'field__range');
      input.type = 'range';
      input.min = control.min;
      input.max = control.max;
      input.step = control.step;
      input.value = settings[control.key];
    }

    input.id = 'control-' + control.key;
    label.htmlFor = input.id;
    inputs[control.key] = input;

    input.addEventListener('input', function () {
      settings[control.key] =
        control.type === 'range' ? parseFloat(input.value) : input.value;
      apply(control);
      if (control.key === 'padX' || control.key === 'padY') applyPageMargins();
      if (valueLabels[control.key]) {
        valueLabels[control.key].textContent = formatValue(control);
      }
      save(settings);
      measureFit();
    });

    field.appendChild(input);

    if (control.presets) {
      var swatches = el('div', 'swatches');
      control.presets.forEach(function (color) {
        var swatch = el('button', 'swatch');
        swatch.type = 'button';
        swatch.style.background = color;
        swatch.title = color;
        swatch.addEventListener('click', function () {
          settings[control.key] = color;
          input.value = color;
          apply(control);
          save(settings);
        });
        swatches.appendChild(swatch);
      });
      field.appendChild(swatches);
    }

    body.appendChild(field);
  });

  panel.appendChild(body);

  var footer = el('div', 'panel__footer');

  fitBadge = el('p', 'fit', 'Measuring…');
  footer.appendChild(fitBadge);

  var download = el('button', 'btn btn--primary', 'Download PDF');
  download.type = 'button';
  download.addEventListener('click', function () { window.print(); });
  footer.appendChild(download);

  footer.appendChild(
    el('p', 'panel__hint', 'Pick "Save as PDF" as the destination and leave margins on Default.')
  );

  var reset = el('button', 'btn btn--ghost', 'Reset to defaults');
  reset.type = 'button';
  reset.addEventListener('click', function () {
    Object.keys(DEFAULTS).forEach(function (key) { settings[key] = DEFAULTS[key]; });
    CONTROLS.forEach(function (control) {
      inputs[control.key].value = settings[control.key];
      if (valueLabels[control.key]) {
        valueLabels[control.key].textContent = formatValue(control);
      }
    });
    applyAll();
    save(settings);
    measureFit();
  });
  footer.appendChild(reset);

  panel.appendChild(footer);

  // Narrow screens: the panel slides away behind a toggle.
  var toggle = document.getElementById('panel-toggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      document.body.classList.toggle('panel-open');
    });
  }

  applyAll();
  measureFit();
})();
</script>
